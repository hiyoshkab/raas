name: Deploy Pipeline

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "helm/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{vars.DOCKERHUB_REPO}}/raas-backend:sha-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with: 
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}

      - name: Setup Helm
        id: install
        uses: azure/setup-helm@v5
        with:
          version: "3.12.0"

      - name: Helm Deploy
        env: 
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_REPO }}/raas-backend
          IMAGE_TAG: sha-${{ github.sha }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
        run: |
          helm upgrade --install raas ./helm/raas \
            --create-namespace \
            --namespace raas \
            --set-string image.repository="${{ env.IMAGE_REPOSITORY }}" \
            --set-string image.tag="${{ env.IMAGE_TAG }}" \
            --set-string appConfig.azureOpenAIEndpoint="${{ env.AZURE_OPENAI_ENDPOINT }}" \
            --atomic \
            --timeout 10m