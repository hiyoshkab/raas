name: Helm Pipeline

on:
  workflow_call:
    inputs:
      image_repository:
        description: Shared image repository prefix for frontend and backend; omit with image_tag to reuse installed release values.
        required: false
        type: string
      image_tag:
        description: Shared frontend and backend image tag; omit with image_repository to reuse installed release values.
        required: false
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true

  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.0.24

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          admin: "false"
          use-kubelogin: "true"

      - name: Setup Helm
        id: install
        uses: azure/setup-helm@v5
        with:
          version: "3.12.0"

      - name: Resolve image references
        id: images
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ -n "$IMAGE_REPOSITORY" && -n "$IMAGE_TAG" ]]; then
            echo "frontend_repository=${IMAGE_REPOSITORY}/raas-frontend" >> "$GITHUB_OUTPUT"
            echo "frontend_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            echo "backend_repository=${IMAGE_REPOSITORY}/raas-backend" >> "$GITHUB_OUTPUT"
            echo "backend_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ -z "$IMAGE_REPOSITORY" && -z "$IMAGE_TAG" ]]; then
            values="$(helm get values raas --namespace raas --all --output json)"
            echo "frontend_repository=$(jq -er '.frontendImage.repository | select(type == "string" and length > 0)' <<< "$values")" >> "$GITHUB_OUTPUT"
            echo "frontend_tag=$(jq -er '.frontendImage.tag | select(type == "string" and length > 0)' <<< "$values")" >> "$GITHUB_OUTPUT"
            echo "backend_repository=$(jq -er '.backendImage.repository | select(type == "string" and length > 0)' <<< "$values")" >> "$GITHUB_OUTPUT"
            echo "backend_tag=$(jq -er '.backendImage.tag | select(type == "string" and length > 0)' <<< "$values")" >> "$GITHUB_OUTPUT"
          else
            echo "::error::image_repository and image_tag must either both be provided or both be omitted."
            exit 1
          fi

      - name: Helm Deploy
        env:
          FRONTEND_IMAGE_REPOSITORY: ${{ steps.images.outputs.frontend_repository }}
          FRONTEND_IMAGE_TAG: ${{ steps.images.outputs.frontend_tag }}
          BACKEND_IMAGE_REPOSITORY: ${{ steps.images.outputs.backend_repository }}
          BACKEND_IMAGE_TAG: ${{ steps.images.outputs.backend_tag }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_APP_CLIENT_ID: ${{ vars.AZURE_APP_CLIENT_ID }}
        run: |
          helm upgrade --install raas ./helm/raas \
            --namespace raas \
            --set-string frontendImage.repository="${FRONTEND_IMAGE_REPOSITORY}" \
            --set-string frontendImage.tag="${FRONTEND_IMAGE_TAG}" \
            --set-string backendImage.repository="${BACKEND_IMAGE_REPOSITORY}" \
            --set-string backendImage.tag="${BACKEND_IMAGE_TAG}" \
            --set-string appConfig.azureOpenAIEndpoint="${AZURE_OPENAI_ENDPOINT}" \
            --set-string azureWorkloadIdentity.clientId="${AZURE_APP_CLIENT_ID}" \
            --atomic \
            --timeout 10m