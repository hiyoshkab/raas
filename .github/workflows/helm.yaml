name: Helm Pipeline

on:
  workflow_call:
    inputs:
      image_repository:
        description: Container image repository to deploy; omit to reuse the installed release's image.
        required: false
        type: string
      image_tag:
        description: Container image tag to deploy; omit to reuse the installed release's image.
        required: false
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
  push:
    branches: [main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yaml"
      - "!app/**"
      - "!requirements.txt"
      - "!Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.0.24

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          admin: "false"
          use-kubelogin: "true"

      - name: Setup Helm
        id: install
        uses: azure/setup-helm@v5
        with:
          version: "3.12.0"

      - name: Get Latest Image Tag
        id: image
        if: inputs.image_tag == ''
        env: 
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        shell: bash
        run: |
          tag=$(curl -fsSL "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/raas-backend/tags?page_size=1" | jq -r '.results[0].name')
          echo tag=$tag >> $GITHUB_OUTPUT

      - name: Helm Deploy
        env:
          IMAGE_REPOSITORY: ${{ inputs.image_repository || vars.DOCKERHUB_REPO }}/raas-backend
          IMAGE_TAG: ${{ inputs.image_tag || steps.image.outputs.tag }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
        run: |
          helm upgrade --install raas ./helm/raas \
            --namespace raas \
            --set-string image.repository="${IMAGE_REPOSITORY}" \
            --set-string image.tag="${IMAGE_TAG}" \
            --set-string appConfig.azureOpenAIEndpoint="${AZURE_OPENAI_ENDPOINT}" \
            --atomic \
            --timeout 10m