server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API permits uploads up to 5 MiB; allow a little room for multipart overhead.
    client_max_body_size 6m;

    location /ingest {
        proxy_pass http://app-backend-service.raas.svc.cluster.local:8000;
    }

    location /query {
        proxy_pass http://app-backend-service.raas.svc.cluster.local:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}