apiVersion: v1
kind: ConfigMap
metadata:
  name: app-configmap
  labels:
    {{- include "raas.labels" . | nindent 4 }}
data:
  AZURE_OPENAI_ENDPOINT: {{ .Values.appConfig.azureOpenAIEndpoint | quote }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.appConfig.azureOpenAIDeployment | quote }}
  LLM_TIMEOUT: {{ .Values.appConfig.llmTimeout | quote }}
  QDRANT_URL: "http://qdrant:6333"
  COLLECTION: {{ .Values.appConfig.collection | quote }}
  EMBED_MODEL: {{ .Values.appConfig.embedModel | quote }}
  EMBED_DIM: {{ .Values.appConfig.embedDim | quote }}
  EMBED_BATCH_SIZE: {{ .Values.appConfig.embedBatchSize | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.appConfig.maxUploadBytes | quote }}
  CHUNK_SIZE: {{ .Values.appConfig.chunkSize | quote }}
  OVERLAP: {{ .Values.appConfig.overlap | quote }}
