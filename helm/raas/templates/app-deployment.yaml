apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  labels:
    {{- include "raas.labels" . | nindent 4 }}
    app: app-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      annotations:
        helm.sh/revision: {{ .Release.Revision | quote }}
      labels:
        app: app-backend
        app.kubernetes.io/name: raas
        app.kubernetes.io/instance: {{ .Release.Name }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.azureWorkloadIdentity.serviceAccountName }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: raas-backend
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ if eq .Values.image.tag "latest" }}Always{{ else }}{{ .Values.image.pullPolicy }}{{ end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: app-configmap
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
