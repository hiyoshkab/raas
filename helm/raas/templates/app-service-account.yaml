apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.azureWorkloadIdentity.serviceAccountName }}
  labels:
    {{- include "raas.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "azureWorkloadIdentity.clientId is required" .Values.azureWorkloadIdentity.clientId | quote }}
