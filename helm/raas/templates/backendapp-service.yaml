apiVersion: v1
kind: Service
metadata:
  name: app-backend-service
  labels:
    {{- include "raas.labels" . | nindent 4 }}
    app: app-backend
spec:
  type: {{ .Values.backendService.type }}
  selector:
    app: app-backend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.backendService.port }}
      targetPort: http
