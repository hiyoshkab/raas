apiVersion: v1
kind: Service
metadata:
  name: app-frontend-service
  labels:
    {{- include "raas.labels" . | nindent 4 }}
    app: app-frontend
spec:
  type: {{ .Values.frontendService.type }}
  selector:
    app: app-frontend
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.frontendService.port }}
      targetPort: http
