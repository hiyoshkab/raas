apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  labels:
    {{- include "raas.labels" . | nindent 4 }}
    app: qdrant
spec:
  clusterIP: None
  selector:
    app: qdrant
  ports:
    - name: http
      protocol: TCP
      port: 6333
      targetPort: http
    - name: grpc
      protocol: TCP
      port: 6334
      targetPort: grpc
